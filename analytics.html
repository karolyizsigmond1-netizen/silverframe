<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics — Silverframe </title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root{--bg:#0a0a0a;--surface:#141414;--surface2:#1c1c1c;--border:#2a2a2a;--gold:#c9a96e;--gold-light:#e8c98a;--text:#f0f0f0;--muted:#888;--green:#4ade80;--red:#f87171;--blue:#60a5fa}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
        .gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
        .gate-box{background:var(--surface);border:1px solid var(--border);padding:3rem 2.5rem;border-radius:12px;width:100%;max-width:360px;text-align:center}
        .gate-logo{font-size:1.1rem;letter-spacing:.2em;color:var(--gold);margin-bottom:2rem;font-weight:600}
        .gate-sub{font-size:.85rem;color:var(--muted);margin-bottom:1.5rem}
        .gate-input{width:100%;padding:.8rem 1rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;margin-bottom:1rem;outline:none;transition:border-color .2s}
        .gate-input:focus{border-color:var(--gold)}
        .gate-btn{width:100%;padding:.85rem;background:var(--gold);color:#000;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .2s;max-width:260px}
        .gate-btn:hover{background:var(--gold-light)}
        .gate-error{color:var(--red);font-size:.82rem;margin-top:.75rem;min-height:1.2em}
        .auth-screen{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;z-index:99}
        .auth-logo{font-size:1.1rem;letter-spacing:.2em;color:var(--gold);font-weight:600}
        .auth-desc{color:var(--muted);font-size:.9rem;text-align:center;max-width:320px}
        #dashboard{display:none;padding-bottom:3rem}
        .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:.9rem 2rem;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;position:sticky;top:0;z-index:10}
        .topbar-logo{font-size:.95rem;letter-spacing:.15em;color:var(--gold);font-weight:600;flex:1}
        .range-btns{display:flex;gap:.4rem}
        .range-btn{padding:.4rem .9rem;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:.78rem;cursor:pointer;transition:all .2s}
        .range-btn.active,.range-btn:hover{background:var(--gold);color:#000;border-color:var(--gold)}
        .icon-btn{padding:.4rem .8rem;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:.78rem;cursor:pointer;transition:all .2s}
        .icon-btn:hover{border-color:var(--gold);color:var(--gold)}
        .main{max-width:1400px;margin:0 auto;padding:2rem}
        .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.5rem}
        .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.25rem 1.5rem;transition:border-color .2s}
        .stat-card:hover{border-color:var(--gold)}
        .stat-label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem}
        .stat-value{font-size:2rem;font-weight:700;color:var(--text);line-height:1}
        .stat-card.gold .stat-value{color:var(--gold)}
        .stat-sub{font-size:.72rem;color:var(--muted);margin-top:.4rem}
        .charts-grid{display:grid;grid-template-columns:2fr 1fr;gap:1rem;margin-bottom:1.5rem}
        .tables-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
        @media(max-width:900px){.charts-grid,.tables-grid{grid-template-columns:1fr}.main{padding:1rem}.topbar{padding:.8rem 1rem}}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.5rem;overflow:hidden}
        .card-title{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:1.25rem}
        .data-table{width:100%;border-collapse:collapse}
        .data-table th{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:.5rem .75rem;text-align:left;border-bottom:1px solid var(--border)}
        .data-table td{padding:.6rem .75rem;font-size:.83rem;border-bottom:1px solid var(--border);position:relative}
        .data-table tr:last-child td{border-bottom:none}
        .data-table tr:hover td{background:var(--surface2)}
        .bar-bg{position:absolute;left:0;top:0;bottom:0;background:var(--gold);opacity:.1;pointer-events:none}
        .num{text-align:right;color:var(--gold);font-weight:600;font-size:.88rem;white-space:nowrap}
        .loading{display:flex;align-items:center;justify-content:center;padding:3rem;color:var(--muted);gap:.75rem}
        .spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
        @keyframes spin{to{transform:rotate(360deg)}}
        .pill{display:inline-block;padding:.12rem .45rem;border-radius:4px;font-size:.7rem;background:var(--surface2);color:var(--gold);font-family:monospace}
        .trend-up{color:var(--green)}
        .trend-down{color:var(--red)}
        .section-title{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:1.5rem 0 .75rem;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
    </style>
</head>
<body>

<div class="gate" id="gate">
    <div class="gate-box">
        <div class="gate-logo">SILVERFRAME</div>
        <div class="gate-sub">Analytics hozzáférés</div>
        <input class="gate-input" type="password" id="gatePass" placeholder="Jelszó" autofocus>
        <button class="gate-btn" id="gateBtn">Belépés</button>
        <div class="gate-error" id="gateErr"></div>
    </div>
</div>

<div class="auth-screen" id="authScreen">
    <div class="auth-logo">SILVERFRAME ANALYTICS</div>
    <div class="auth-desc">Jelentkezz be Google-fiókkal az adatok megtekintéséhez</div>
    <div id="gSignIn"></div>
</div>

<div id="dashboard">
    <div class="topbar">
        <div class="topbar-logo">SILVERFRAME ANALYTICS</div>
        <div class="range-btns">
            <button class="range-btn active" data-days="7">7 nap</button>
            <button class="range-btn" data-days="30">30 nap</button>
            <button class="range-btn" data-days="90">90 nap</button>
        </div>
        <div style="display:flex;gap:.5rem">
            <button class="icon-btn" id="refreshBtn">↺ Frissítés</button>
            <button class="icon-btn" id="logoutBtn">Kijelentkezés</button>
        </div>
    </div>

    <div class="main">
        <div class="stat-grid" id="statGrid">
            <div class="stat-card"><div class="loading"><div class="spinner"></div></div></div>
            <div class="stat-card"><div class="loading"><div class="spinner"></div></div></div>
            <div class="stat-card"><div class="loading"><div class="spinner"></div></div></div>
            <div class="stat-card"><div class="loading"><div class="spinner"></div></div></div>
        </div>

        <div class="charts-grid">
            <div class="card">
                <div class="card-title">Munkamenetek — napi bontás</div>
                <canvas id="sessionsChart" height="75"></canvas>
            </div>
            <div class="card">
                <div class="card-title">Eszközök</div>
                <canvas id="deviceChart"></canvas>
            </div>
        </div>

        <div class="tables-grid">
            <div class="card">
                <div class="card-title">Legtöbbet látogatott oldalak</div>
                <div id="pagesTable"><div class="loading"><div class="spinner"></div></div></div>
            </div>
            <div class="card">
                <div class="card-title">Egyéni események</div>
                <div id="eventsTable"><div class="loading"><div class="spinner"></div></div></div>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
  var GA_PROP = '536432576';
  var CLIENT_ID = '1035859647139-oagj2o4llahv22rff7s2bera9ca13kvr.apps.googleusercontent.com';
  var PASS = 'silverframe';
  var token = null;
  var days = 7;
  var charts = {};

  var gate = document.getElementById('gate');
  var authSc = document.getElementById('authScreen');
  var dash = document.getElementById('dashboard');

  // ── Password ──
  function checkPass() {
    var v = document.getElementById('gatePass').value;
    if (v === PASS) {
      gate.style.display = 'none';
      token ? showDash() : showAuth();
    } else {
      document.getElementById('gateErr').textContent = 'Helytelen jelszó';
    }
  }
  document.getElementById('gateBtn').onclick = checkPass;
  document.getElementById('gatePass').onkeydown = function(e){ if(e.key==='Enter') checkPass(); };

  // ── Google Auth ──
  function showAuth() {
    authSc.style.display = 'flex';
    if (window.google && window.google.accounts) initAuth();
    else document.querySelector('script[src*="gsi"]').onload = initAuth;
  }

  var tokenClient;
  function initAuth() {
    if (!window.google) { setTimeout(initAuth, 200); return; }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/analytics.readonly',
      callback: function(r) {
        if (r.error) return;
        token = r.access_token;
        authSc.style.display = 'none';
        showDash();
      }
    });
    var btn = document.createElement('button');
    btn.className = 'gate-btn';
    btn.textContent = 'Bejelentkezés Google-lel';
    btn.onclick = function(){ tokenClient.requestAccessToken(); };
    document.getElementById('gSignIn').appendChild(btn);
  }

  document.getElementById('logoutBtn').onclick = function(){
    token = null; dash.style.display = 'none';
    gate.style.display = 'flex';
    document.getElementById('gatePass').value = '';
  };
  document.getElementById('refreshBtn').onclick = function(){ if(token) loadAll(); };

  // ── Date range ──
  document.querySelectorAll('.range-btn').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('.range-btn').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      days = parseInt(b.dataset.days);
      if (token) loadAll();
    };
  });

  function showDash() { dash.style.display = 'block'; loadAll(); }

  // ── GA4 API ──
  async function api(body) {
    var r = await fetch('https://analyticsdata.googleapis.com/v1beta/properties/'+GA_PROP+':runReport', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer '+token, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    return r.json();
  }

  function sd() { return days+'daysAgo'; }

  function loadAll() {
    loadStats(); loadSessionChart(); loadDeviceChart(); loadPages(); loadEvents();
  }

  // Stat cards
  async function loadStats() {
    var d = await api({
      dateRanges: [
        { startDate: sd(), endDate: 'today' },
        { startDate: (days*2)+'daysAgo', endDate: (days+1)+'daysAgo' }
      ],
      metrics: [
        { name:'activeUsers' }, { name:'sessions' },
        { name:'screenPageViews' }, { name:'averageSessionDuration' }
      ]
    });
    var cur = (d.rows&&d.rows[0]) ? d.rows[0].metricValues : [{value:0},{value:0},{value:0},{value:0}];
    var prv = (d.rows&&d.rows[1]) ? d.rows[1].metricValues : [{value:0},{value:0},{value:0},{value:0}];
    function tr(c,p){
      var cv=parseFloat(c.value)||0, pv=parseFloat(p.value)||0;
      if(!pv) return '';
      var dt=Math.round((cv-pv)/pv*100);
      return '<span class="trend-'+(dt>=0?'up':'down')+'">'+(dt>=0?'↑':'↓')+Math.abs(dt)+'%</span> előző időszak';
    }
    function dur(s){ s=Math.round(parseFloat(s)||0); return Math.floor(s/60)+'p '+(s%60)+'mp'; }
    var cards=[
      {label:'Felhasználók', val:parseInt(cur[0].value).toLocaleString('hu'), sub:tr(cur[0],prv[0])},
      {label:'Munkamenetek', val:parseInt(cur[1].value).toLocaleString('hu'), sub:tr(cur[1],prv[1])},
      {label:'Oldalmegtekintések', val:parseInt(cur[2].value).toLocaleString('hu'), sub:tr(cur[2],prv[2]), gold:true},
      {label:'Átl. munkamenet', val:dur(cur[3].value), sub:tr(cur[3],prv[3])}
    ];
    document.getElementById('statGrid').innerHTML = cards.map(function(c){
      return '<div class="stat-card'+(c.gold?' gold':'')+'"><div class="stat-label">'+c.label+'</div><div class="stat-value">'+c.val+'</div><div class="stat-sub">'+c.sub+'</div></div>';
    }).join('');
  }

  // Sessions line chart
  async function loadSessionChart() {
    var d = await api({
      dateRanges:[{startDate:sd(),endDate:'today'}],
      dimensions:[{name:'date'}],
      metrics:[{name:'sessions'},{name:'activeUsers'}],
      orderBys:[{dimension:{dimensionName:'date'}}]
    });
    var labels=[],sess=[],users=[];
    (d.rows||[]).forEach(function(r){
      var dt=r.dimensionValues[0].value;
      labels.push(dt.slice(4,6)+'.'+dt.slice(6,8));
      sess.push(parseInt(r.metricValues[0].value)||0);
      users.push(parseInt(r.metricValues[1].value)||0);
    });
    if(charts.sess) charts.sess.destroy();
    charts.sess = new Chart(document.getElementById('sessionsChart'),{
      type:'line',
      data:{labels:labels,datasets:[
        {label:'Munkamenetek',data:sess,borderColor:'#c9a96e',backgroundColor:'rgba(201,169,110,.12)',tension:.4,fill:true,pointRadius:3,pointHoverRadius:5},
        {label:'Felhasználók',data:users,borderColor:'#60a5fa',backgroundColor:'transparent',tension:.4,pointRadius:2}
      ]},
      options:{responsive:true,maintainAspectRatio:true,
        plugins:{legend:{labels:{color:'#666',font:{size:10}}}},
        scales:{
          x:{ticks:{color:'#555',font:{size:10}},grid:{color:'#1c1c1c'}},
          y:{ticks:{color:'#555',font:{size:10}},grid:{color:'#1c1c1c'}}
        }
      }
    });
  }

  // Device doughnut
  async function loadDeviceChart() {
    var d = await api({
      dateRanges:[{startDate:sd(),endDate:'today'}],
      dimensions:[{name:'deviceCategory'}],
      metrics:[{name:'sessions'}]
    });
    var map={mobile:'Mobil',desktop:'Asztali',tablet:'Tablet'};
    var labels=[],vals=[];
    (d.rows||[]).forEach(function(r){
      labels.push(map[r.dimensionValues[0].value]||r.dimensionValues[0].value);
      vals.push(parseInt(r.metricValues[0].value)||0);
    });
    if(charts.dev) charts.dev.destroy();
    charts.dev = new Chart(document.getElementById('deviceChart'),{
      type:'doughnut',
      data:{labels:labels,datasets:[{data:vals,backgroundColor:['#c9a96e','#60a5fa','#4ade80'],borderWidth:0,hoverOffset:4}]},
      options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:'#666',font:{size:11},padding:16}}}}
    });
  }

  // Top pages
  async function loadPages() {
    var d = await api({
      dateRanges:[{startDate:sd(),endDate:'today'}],
      dimensions:[{name:'pagePath'}],
      metrics:[{name:'screenPageViews'},{name:'sessions'}],
      orderBys:[{metric:{metricName:'screenPageViews'},desc:true}],
      limit:12
    });
    var rows=d.rows||[];
    var max=rows.length?parseInt(rows[0].metricValues[0].value):1;
    var html='<table class="data-table"><thead><tr><th>Oldal</th><th style="text-align:right">Látogatás</th><th style="text-align:right">Munkamenet</th></tr></thead><tbody>';
    rows.forEach(function(r){
      var p=r.dimensionValues[0].value;
      var v=parseInt(r.metricValues[0].value)||0;
      var s=parseInt(r.metricValues[1].value)||0;
      var pct=Math.round(v/max*100);
      var name=p.replace(/^//,'').replace(/.html$/,'').replace(/^services//,'').replace(/^portfolio//,'').replace(/-/g,' ')||'Főoldal';
      html+='<tr><td><div class="bar-bg" style="width:'+pct+'%"></div>'+name+'</td><td class="num">'+v.toLocaleString('hu')+'</td><td class="num" style="color:var(--muted)">'+s.toLocaleString('hu')+'</td></tr>';
    });
    html+='</tbody></table>';
    document.getElementById('pagesTable').innerHTML=html;
  }

  // Events
  async function loadEvents() {
    var d = await api({
      dateRanges:[{startDate:sd(),endDate:'today'}],
      dimensions:[{name:'eventName'}],
      metrics:[{name:'eventCount'}],
      orderBys:[{metric:{metricName:'eventCount'},desc:true}],
      limit:25
    });
    var skip={session_start:1,first_visit:1,user_engagement:1,gtag_config:1};
    var rows=(d.rows||[]).filter(function(r){ return !skip[r.dimensionValues[0].value]; });
    var max=rows.length?parseInt(rows[0].metricValues[0].value):1;
    var html='<table class="data-table"><thead><tr><th>Esemény</th><th style="text-align:right">Szám</th></tr></thead><tbody>';
    rows.forEach(function(r){
      var n=r.dimensionValues[0].value;
      var v=parseInt(r.metricValues[0].value)||0;
      var pct=Math.round(v/max*100);
      html+='<tr><td><div class="bar-bg" style="width:'+pct+'%"></div><span class="pill">'+n+'</span></td><td class="num">'+v.toLocaleString('hu')+'</td></tr>';
    });
    html+='</tbody></table>';
    document.getElementById('eventsTable').innerHTML=html;
  }

})();
</script>
</body>
</html>
